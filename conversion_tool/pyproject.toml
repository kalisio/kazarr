[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kazarr-conversion-tool"
version = "1.0.0"
description = "A tool to process various data formats to Zarr datasets compatible with the kazarr service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
keywords = ["zarr", "netcdf", "grib", "xarray", "conversion", "kalisio"]

dependencies = [
    "xarray==2026.4.0",
    "zarr==3.1.6",
    "h5py==3.15.1",
    "h5netcdf==1.7.3",
    "numpy==2.3.4",
    "pyproj==3.7.2",
    "dask[distributed]==2026.3.0",
    "s3fs==2025.10.0",
    "matplotlib==3.10.7",
    "pyvista==0.46.4",
    "platformdirs==4.10.0",
    "bokeh==3.0.0",
]

[project.optional-dependencies]
# eccodes is pinned >=2.45 ON PURPOSE, which is the opposite of the usual
# advice for https://github.com/ecmwf/eccodes-python/issues/150. Versions
# >=2.45 have broken PyPI metadata that DROPS the "eccodeslib" dependency
# (which bundles a precompiled ecCodes binary for Linux/macOS via a vendored
# eckit, which in turn vendors its own PROJ). We don't want eccodeslib at
# all: eckit's bundled PROJ (9.8.x) coexists in the same process as pyproj's
# own bundled PROJ (9.5.x, see the pyproj pin above) and the two conflict at
# the C++ ABI level, crashing PyInstaller builds with glibc heap corruption
# ("corrupted size vs. prev_size") on interpreter shutdown. So we deliberately
# keep the "none-any" pure-Python wheel (falls back to findlibs) and provide
# our own clean ecCodes native library instead - see the Dockerfile, which
# installs a recent one from conda-forge (no proj/eckit dependency at all:
# https://github.com/conda-forge/eccodes-feedstock). Revisit this once
# eccodes-python's metadata bug is fixed upstream AND eccodeslib no longer
# vendors its own PROJ (or vendors a version identical to pyproj's).
grib = ["cfgrib>=0.9.15.1", "eccodes>=2.45"]

[dependency-groups]
# Required to build the standalone executable
build = ["pyinstaller>=6.21.0"]

[project.scripts]
kazarr = "kazarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kazarr"]