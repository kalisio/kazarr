[project]
name = "kazarr"
version = "0.1.0"
description = "A lightweight FastAPI service that exposes endpoints to interact with Zarr datasets stored in a Simple Storage Service (S3)"
requires-python = ">=3.11"

dependencies = [
  "xarray>=2026.4.0",
  "zarr>=3.1.6",
  "cfgrib>=0.9.15.1",
  "h5py>=3.15.1",
  "h5netcdf>=1.7.3",
  "numpy>=2.3.4",
  "pyproj>=3.7.2",
  "dask[distributed]>=2026.3.0",
  "s3fs>=2025.10.0",
  "matplotlib>=3.10.7",
  "pyvista>=0.46.4",
  "platformdirs>=4.10.0",
  "bokeh>=3.0.0",
  "fastapi>=0.136.3",
  "uvicorn>=0.35.0",
  "matplotlib>=3.10.7",
  "vtk>=9.5.2",
  "scipy>=1.16.3",
  "uvloop>=0.22.1",
  "loguru>=0.7.3",
  "diskcache>=5.6.3"
]

[dependency-groups]
test = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
markers = [
  "General: General tests for the API",
  "RegularGrid: Tests for regular grid datasets",
  "RectilinearGrid: Tests for rectilinear grid datasets",
  "CompareRegularVsRectilinear: Tests comparing regular and rectilinear grid datasets",
  "RadialGrid: Tests for radial grid datasets",
  "PointList: Tests for point list datasets",
  "Dataset3D: Tests for 3D datasets",
  "CustomEccodes: Tests for custom ECCODES functionalities",
  "CombineDatasets: Tests for combining datasets",
]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff.lint]
ignore = ["BLE001"]